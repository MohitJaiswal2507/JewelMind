# ====================================================================
# JewelMind Phase 7 — Jewellery LoRA Fine-Tuning Configuration
# Tailored for NVIDIA GeForce RTX 4060 Laptop GPU (8,188 MiB VRAM)
# ====================================================================

# Base Model and Adaptation Targets
model:
  pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
  revision: "main"
  variant: "fp16"
  lora_rank: 16               # Rank 16 keeps parameter count minimal (~3.2 MB)
  lora_alpha: 32              # Alpha scaling factor (2 * rank -> multiplier 2.0)
  lora_dropout: 0.05
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"

# Dataset Specification
dataset:
  train_data_dir: "datasets/appearance_lora"
  train_metadata_file: "datasets/appearance_lora/splits/train_metadata.jsonl"
  val_data_dir: "datasets/appearance_lora"
  val_metadata_file: "datasets/appearance_lora/splits/val_metadata.jsonl"
  resolution: 512             # 512x512 native for SD 1.5
  keep_aspect_ratio: true     # Letterbox pads to square without squashing/distorting jewellery geometry
  center_crop: false          # Strictly FALSE: do not crop out rings, bezels, or chains
  random_flip: false          # Strictly FALSE: jewellery geometry & prongs must not be mirrored
  caption_column: "text"
  image_column: "file_name"
  max_train_samples: null

# Training Hyperparameters for 8GB VRAM
#
# NOTE ON STEP SIZING FOR 150-200 IMAGE DATASET:
# With train_batch_size: 1 and gradient_accumulation_steps: 4, each optimizer step processes 4 images.
# Formulas:
#   steps_per_epoch = ceil(N_train / 4)
#   max_train_steps = target_epochs * steps_per_epoch
#
# Recommended sizing guide:
#   For N = 160 train images: steps_per_epoch = 40. Target 20-25 epochs -> max_train_steps: 800 - 1000.
#   For N = 100 train images: steps_per_epoch = 25. Target 20-25 epochs -> max_train_steps: 500 - 625.
#   For N = 50 train images:  steps_per_epoch = 13. Target 20-25 epochs -> max_train_steps: 260 - 325.
#
# Set max_train_steps below once your actual dataset size is finalized.
training:
  seed: 42
  train_batch_size: 1             # Strictly 1 on 8GB VRAM to avoid CUDA OOM
  gradient_accumulation_steps: 4  # Effective batch size = 4
  gradient_checkpointing: true    # Essential: drops activation VRAM to ~4.2GB
  mixed_precision: "fp16"         # Float16 mixed precision
  learning_rate: 1.0e-4           # Standard AdamW LoRA learning rate
  scale_lr: false
  lr_scheduler: "cosine"
  lr_warmup_steps: 50
  max_train_steps: 1000           # Adjust to ~20-25 epochs based on actual dataset count
  checkpointing_steps: 200        # Save checkpoint every 200 optimizer steps
  checkpoints_total_limit: 3      # Retain last 3 checkpoints to conserve disk space
  resume_from_checkpoint: "latest" # Auto-resumes from last saved checkpoint if present

# Optimizer Configuration
optimizer:
  name: "AdamW"
  beta1: 0.9
  beta2: 0.999
  weight_decay: 1.0e-2
  epsilon: 1.0e-8
  use_8bit_adam: false

# Output Directories (Git-ignored)
output:
  output_dir: "outputs/appearance_lora"
  logging_dir: "outputs/appearance_lora/logs"
  report_to: "tensorboard"
