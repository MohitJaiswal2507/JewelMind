# ====================================================================
# JewelMind Phase 7 — Jewellery LoRA Fine-Tuning Configuration
# Tailored for NVIDIA GeForce RTX 4060 Laptop GPU (8,188 MiB VRAM)
# ====================================================================

# Base Model and Adaptation Targets
model:
  pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
  revision: "main"
  variant: "fp16"
  lora_rank: 16               # Low rank rank=16 keeps parameter count minimal (~3.2 MB)
  lora_alpha: 32              # Alpha scaling factor (2 * rank)
  lora_dropout: 0.05
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"

# Dataset Specification
dataset:
  train_data_dir: "datasets/jewellery_lora/train"
  val_data_dir: "datasets/jewellery_lora/val"
  resolution: 512             # 512x512 native for SD 1.5
  center_crop: false
  random_flip: true
  caption_column: "text"
  image_column: "image"
  max_train_samples: null

# Training Hyperparameters for 8GB VRAM
training:
  seed: 42
  train_batch_size: 1         # Strictly 1 on 8GB VRAM
  gradient_accumulation_steps: 4  # Effective batch size = 4
  gradient_checkpointing: true    # Essential: drops VRAM from ~7.5GB to ~4.2GB
  mixed_precision: "fp16"     # Float16 mixed precision
  learning_rate: 1.0e-4       # AdamW standard LoRA LR
  scale_lr: false
  lr_scheduler: "cosine"
  lr_warmup_steps: 50
  max_train_steps: 1000
  checkpointing_steps: 200    # Save checkpoint every 200 steps
  checkpoints_total_limit: 3  # Keep last 3 checkpoints to conserve disk space
  resume_from_checkpoint: "latest" # Auto-resumes from last saved checkpoint if present

# Optimizer Configuration
optimizer:
  name: "AdamW"
  beta1: 0.9
  beta2: 0.999
  weight_decay: 1.0e-2
  epsilon: 1.0e-8
  use_8bit_adam: false        # Optional bitsandbytes 8-bit Adam for further memory saving

# Output Directories (Git-ignored)
output:
  output_dir: "models/lora/jewellery_v1"
  logging_dir: "models/lora/jewellery_v1/logs"
  report_to: "tensorboard"
