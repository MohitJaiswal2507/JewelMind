# ==============================================================================
# JewelMind Container Orchestration (Docker Compose v2)
# Multi-container setup: Frontend (Nginx/React), Backend (FastAPI), AI (CUDA)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. AI Inference Worker (NVIDIA GPU Accelerated)
  # ----------------------------------------------------------------------------
  ai:
    container_name: jewelmind-ai
    build:
      context: .
      dockerfile: ai/Dockerfile
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - JEWELMIND_MODEL_DIR=/app/models
      - JEWELMIND_OUTPUT_DIR=/app/outputs
      - JEWELMIND_RUNS_DIR=/app/runs
      - JEWELMIND_FINAL_CONTROLNET_DIR=/app/outputs/rendering_v2_controlnet/controlnet_rendering_v2_final
      - JEWELMIND_LORA_DIR=/app/outputs/appearance_lora/jewellery_lora_final
      - JEWELMIND_SD_DIR=/app/models/diffusion/models--runwayml--stable-diffusion-v1-5/snapshots/451f4fe16113bff5a5d2269ed5ad43b0592e9a14
    volumes:
      # Read-only model mounts preserving host weights
      - ./models:/app/models:ro
      - ./outputs:/app/outputs:ro
      - ./runs:/app/runs:ro
    ports:
      - "${AI_WORKER_PORT:-8001}:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - jewelmind-network

  # ----------------------------------------------------------------------------
  # 2. Backend API Server (FastAPI)
  # ----------------------------------------------------------------------------
  backend:
    container_name: jewelmind-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:80,http://127.0.0.1:5173}
      - AI_WORKER_URL=http://ai:8001
      - AI_WORKER_TIMEOUT=${AI_WORKER_TIMEOUT:-120}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - jewelmind-network

  # ----------------------------------------------------------------------------
  # 3. Frontend Web Application (React 19 + Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    container_name: jewelmind-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-${SUPABASE_URL}}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY}}
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - jewelmind-network

networks:
  jewelmind-network:
    driver: bridge
